server.port=8080
spring.application.name=API-GATEWAY

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=policy-service
spring.cloud.gateway.routes[0].uri=lb://POLICY-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/policies/**

spring.cloud.gateway.routes[1].id=claim-service
spring.cloud.gateway.routes[1].uri=lb://CLAIM-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/claims/**

spring.cloud.gateway.routes[2].id=settlement-service
spring.cloud.gateway.routes[2].uri=lb://SETTLEMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/settlements/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

jwt.secret=InsuranceClaimSystemSuperSecretKeyWithMinimum256BitsLengthForJWTSigning123456
jwt.expirationMs=86400000

